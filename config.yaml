# Binance Agent OS Multi-Strategy Bot — Configuration
# Public values only. Strategy algorithm parameters live in the strategy code
# files (kept private, not documented here).

execution:
  # Binance Agent OS MCP endpoint (OAuth, no API keys)
  mcp_url: "https://agent.binance.com/mcp/agentic"
  # Number of confirmation-gated write retries before giving up a cycle
  max_write_retries: 3
  refresh_seconds: 5

markets:
  # Universe = top-N USDT pairs by 24h quote volume (dynamic, refreshed each scan)
  top_n_pairs: 20
  quote_asset: "USDT"
  # Optional hard allowlist; if empty, the top-N dynamic universe is used.
  allowlist: []
  min_quote_volume: 10000000

sizing:
  # Spot: fixed notional per order (USD)
  spot_notional_usd: 6
  # Futures: fraction of futures wallet balance used per entry
  futures_balance_fraction: 0.05
  futures_leverage: 3
  # Balance assumed in paper/demo mode (no live account read)
  paper_balance: 1000

risk:
  # Hard cap on total open trades across all strategies (spot + futures)
  max_open_trades: 5
  # Stop-loss / take-profit defaults (fractions of entry price)
  default_stop_loss_pct: 0.03
  default_take_profit_pct: 0.05
  # Volatility-based TP/SL: stop and target are set from each symbol's live
  # ATR(14)/price, scaled by these multipliers. Multiplier 0 disables that leg
  # and the fixed default above is used instead.
  stop_atr_multiplier: 1.5
  take_profit_atr_multiplier: 3.0
  # Clamp TP/SL fractions so volatility extremes can't set absurd values.
  stop_min_pct: 0.01      # never tighter than 1%
  stop_max_pct: 0.08      # never wider than 8%
  take_profit_max_pct: 0.20

terminal:
  # Log file the live terminal tails
  live_log: "~/.binance-os-strategies/logs/live.jsonl"
  demo_log: "~/.binance-os-strategies/logs/demo.jsonl"

strategies:
  enabled:
    grid: true
    regime_rotation: true
    volume_spike: true
    funding_rate: true
